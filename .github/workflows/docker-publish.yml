name: Publicar imagen en Docker Hub

# Publica drakonis96/hipertracker (linux/amd64) al crear un tag vX.Y.Z
# o manualmente desde la pestaña Actions.
#
# OPCIONAL: solo se ejecuta si defines estos secretos en el repositorio
# (Settings → Secrets and variables → Actions). Si no están, el workflow
# se omite sin fallar (la imagen también puede publicarse a mano con
# `docker buildx build --platform linux/amd64 --push .`).
#   - DOCKERHUB_USERNAME : tu usuario de Docker Hub (drakonis96)
#   - DOCKERHUB_TOKEN    : un Access Token de Docker Hub con permiso de escritura

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar secretos de Docker Hub
        id: check
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Secretos de Docker Hub no configurados; se omite la publicación automática."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.check.outputs.enabled == 'true'
        uses: actions/checkout@v4

      - name: Configurar Buildx
        if: steps.check.outputs.enabled == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login en Docker Hub
        if: steps.check.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Metadatos (tags)
        if: steps.check.outputs.enabled == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: drakonis96/hipertracker
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build y push (linux/amd64)
        if: steps.check.outputs.enabled == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
