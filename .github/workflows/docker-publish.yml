name: Publicar imagen en Docker Hub

# Publica drakonis96/hipertracker (linux/amd64) al crear un tag vX.Y.Z
# o manualmente desde la pestaña Actions.
#
# Requiere dos secretos en el repositorio (Settings → Secrets and variables → Actions):
#   - DOCKERHUB_USERNAME : tu usuario de Docker Hub (drakonis96)
#   - DOCKERHUB_TOKEN    : un Access Token de Docker Hub con permiso de escritura

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Metadatos (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: drakonis96/hipertracker
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build y push (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
