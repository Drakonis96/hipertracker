# Despliegue desde la imagen publicada en Docker Hub (sin compilar en local).
#
#   docker compose -f docker-compose.hub.yml up -d
#
# La imagen se construye para linux/amd64 (ver .github/workflows/docker-publish.yml).
services:
  hipertracker:
    image: drakonis96/hipertracker:latest
    platform: linux/amd64
    container_name: hipertracker
    ports:
      - "5794:5794"
    volumes:
      - ./data:/app/data
      # Para personalizar los logos de tiendas, descomenta:
      # - ./logos-personalizados:/app/server/public/logos
    environment:
      - NODE_ENV=production
      - PORT=5794
      - DB_PATH=/app/data/hipertracker.db
      - JWT_SECRET=change_me_in_production
      # - ALLOWED_ORIGINS=https://miapp.example.com
      # Login propio de la app (opcional). Si defines ambos, toda la API queda
      # protegida con una pantalla de login (no necesitas Basic Auth del proxy).
      # - APP_AUTH_USER=admin
      # - APP_AUTH_PASSWORD=cambia_esto
    restart: unless-stopped
